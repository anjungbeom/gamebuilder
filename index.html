<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1420">
<meta name="description" content="그린 형질로 길을 열고 다섯 개의 개척 맥점을 잇는 절차 생성 탐험 게임.">
<link rel="canonical" href="https://anjungbeom.github.io/gamebuilder/">
<meta property="og:type" content="website">
<meta property="og:title" content="Drawn Frontier — 길이 없으면, 그려서 연다">
<meta property="og:description" content="직접 그린 장비로 절차 생성 세계를 개척하고 크리처를 포획하는 도트 탐험 게임.">
<meta property="og:url" content="https://anjungbeom.github.io/gamebuilder/">
<meta property="og:image" content="https://anjungbeom.github.io/gamebuilder/thumbnail.png">
<meta property="og:image:width" content="1920">
<meta property="og:image:height" content="1080">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Drawn Frontier — 길이 없으면, 그려서 연다">
<meta name="twitter:description" content="직접 그린 장비로 절차 생성 세계를 개척하고 크리처를 포획하는 도트 탐험 게임.">
<meta name="twitter:image" content="https://anjungbeom.github.io/gamebuilder/thumbnail.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Drawn Frontier — 길이 없으면, 그려서 연다</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="frame">
  <div id="stage">
    <canvas id="game" width="384" height="216" aria-label="게임 화면"></canvas>

    <!-- 도구 패널: 평소엔 든 도구를, 그리는 중엔 실시간 분석을 보여준다 -->
    <div id="tool-panel" class="panel" hidden>
      <div class="tool-head">
        <span id="tool-name">도구 없음</span>
        <span id="tool-dura" class="dura"></span>
      </div>
      <div id="dura-meter" class="dura-meter" hidden><i id="dura-fill"></i></div>
      <div id="bars"></div>
    </div>

    <div id="vitals" class="panel" hidden aria-label="탐험가 상태">
      <div id="hearts" class="hearts"></div>
      <div class="rank-line"><span>개척 공명</span><b id="p-resonance">0</b></div>
      <div class="shoe-line"><span>신발</span><b id="shoe-name">기본 장화</b></div>
      <div class="palette-key"><kbd>Tab</kbd> 장비·수집 팔레트</div>
    </div>

    <div id="progress" class="panel" hidden>
      <div><b id="p-marks">0</b><span>/5 맥점</span></div>
      <div><b id="p-catalog">0</b><span>종 기록</span></div>
      <div><b id="p-depth">0</b><span>최장 거리</span></div>
      <div><b id="p-captures">0</b><span>위협 포획</span></div>
      <div><b id="p-ink">10</b><span>남은 획</span></div>
    </div>

    <div id="map-panel" class="panel" hidden>
      <div class="map-head"><span>현장 나침반</span><b id="map-coord">0 · 0</b></div>
      <canvas id="minimap" width="88" height="64" aria-label="주변 지형 지도"></canvas>
      <div id="goal-text" class="goal-text">가장 가까운 맥점을 찾는 중</div>
    </div>

    <div id="hint" class="hint" hidden></div>
    <div id="toast" class="toast" hidden></div>

    <!-- 그리기 화면 -->
    <div id="draw-layer" hidden>
      <div id="draw-box">
        <div class="draw-title"><span class="draw-sigil" aria-hidden="true"></span><span id="draw-title-text">손도구 설계</span></div>
        <canvas id="pad" width="300" height="220"></canvas>
        <div id="draw-legend" class="draw-legend">
          <span><i class="k">뾰족하게</i> 바위</span>
          <span><i class="k">길게</i> 거리</span>
          <span><i class="k">닫아서</i> 물길</span>
          <span><i class="k">여러 획</i> 포획</span>
        </div>
        <div id="draw-budget" class="draw-budget">획을 그릴 때마다 수집한 획 조각 1개를 사용한다</div>
        <div class="draw-keys">
          <button data-act="confirm">제작 <kbd>Enter</kbd></button>
          <button data-act="clear">다시 그리기 <kbd>Backspace</kbd></button>
          <button data-act="cancel">접기 <kbd>Esc</kbd></button>
        </div>
      </div>
    </div>

    <!-- 타이틀 / 도감 / 결말 -->
    <div id="overlay" hidden></div>
  </div>
</div>
<script type="module" src="src/game.js"></script>
</body>
</html>
