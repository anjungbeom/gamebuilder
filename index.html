<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4c7">
<meta name="description" content="화면에 그은 획의 길이, 꺾인 각도, 감싼 넓이, 갈래의 수가 그대로 장비 성능이 되는 절차 생성 도트 탐험 게임. 일정 크기의 랜덤 맵을 모두 개척하는 것이 목표!">
<link rel="canonical" href="https://anjungbeom.github.io/gamebuilder/">
<meta property="og:type" content="website">
<meta property="og:title" content="Drawn Frontier — 그림으로 도구를 만들고 개척하기! ✨">
<meta property="og:description" content="획의 길이, 꺾인 각도, 감싼 넓이, 갈래의 수가 장비 성능이 되는 절차 생성 도트 탐험 게임. 랜덤 맵을 모두 개척하자!">
<meta property="og:url" content="https://anjungbeom.github.io/gamebuilder/">
<meta property="og:image" content="https://anjungbeom.github.io/gamebuilder/thumbnail.png">
<meta property="og:image:width" content="1920">
<meta property="og:image:height" content="1080">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Drawn Frontier — 그림으로 도구를 만들고 개척하기! ✨">
<meta name="twitter:description" content="획의 길이, 꺾인 각도, 감싼 넓이, 갈래의 수가 장비 성능이 되는 절차 생성 도트 탐험 게임. 랜덤 맵을 모두 개척하자!">
<meta name="twitter:image" content="https://anjungbeom.github.io/gamebuilder/thumbnail.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Drawn Frontier — 그림으로 도구를 만들고 개척하기! ✨</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="frame">
  <div id="stage">
    <canvas id="game" width="384" height="216" aria-label="게임 화면"></canvas>

    <!-- 도구 패널: 평소엔 든 도구를, 그리는 중엔 실시간 분석을 보여준다 -->
    <div id="tool-panel" class="panel" hidden>
      <div class="tool-head">
        <span id="tool-name">도구 없음</span>
        <span id="tool-dura" class="dura"></span>
      </div>
      <div id="dura-meter" class="dura-meter" hidden><i id="dura-fill"></i></div>
      <div id="bars"></div>
    </div>

    <div id="vitals" class="panel" hidden aria-label="탐험가 상태">
      <div id="hearts" class="hearts"></div>
      <div class="rank-line"><span>탐사 등급</span><b id="p-resonance">0등급</b></div>
      <div class="shard-line"><span>기술 조각</span><b id="p-fragments">0 / 2</b></div>
      <div class="shoe-line"><span>신발</span><b id="shoe-name">기본 장화</b></div>
      <div class="environment-line"><span id="env-time">낮</span><b id="env-weather">맑음</b></div>
      <div class="environment-line"><span id="env-temp">쾌적</span><b id="env-noise">조용함</b></div>
      <div id="palette-key" class="palette-key"><kbd>Space</kbd> 공격 · <kbd>T</kbd> 투척 · <kbd>P</kbd> 패링 · <kbd>/</kbd> 모멘텀 대시 · <kbd>L</kbd> 조준 락온 · <kbd>F</kbd> 포획</div>
    </div>

    <div id="progress" class="panel" hidden>
      <div><b id="p-marks">탐색</b><span>신호기</span></div>
      <div><b id="p-catalog">0</b><span>발견한 종</span></div>
      <div><b id="p-depth">탐사</b><span>이동</span></div>
      <div><b id="p-captures">0</b><span>적대 포획</span></div>
      <div><b id="p-ink">10</b><span>잉크</span></div>
    </div>

    <div id="map-panel" class="panel" hidden>
      <div class="map-head"><span>현장 나침반</span><b id="map-coord">0 · 0</b></div>
      <canvas id="minimap" width="88" height="64" aria-label="주변 지형 지도"></canvas>
      <div id="goal-text" class="goal-text">가장 가까운 신호기를 찾는 중</div>
    </div>

    <div id="hint" class="hint" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <div id="celebration" class="celebration" hidden></div>
    <div id="reward-feed" class="reward-feed" hidden></div>

    <!-- 그리기 화면 -->
    <div id="draw-layer" hidden>
      <div id="draw-box">
        <div class="draw-title"><span class="draw-sigil" aria-hidden="true"></span><span id="draw-title-text">손도구 설계</span></div>
        <canvas id="pad" width="300" height="220"></canvas>
        <div id="draw-legend" class="draw-legend">
          <span><i class="k">뾰족하게</i> 파쇄력</span>
          <span><i class="k">길게</i> 사거리</span>
          <span><i class="k">닫아서</i> 부력</span>
          <span><i class="k">여러 획</i> 포획력</span>
        </div>
        <div id="draw-budget" class="draw-budget">획 하나를 그릴 때마다 잉크 1개를 사용합니다.</div>
        <div class="draw-keys">
          <button data-act="confirm">제작 <kbd>Enter</kbd></button>
          <button data-act="delete-toggle">획 지우기</button>
          <button data-act="clear">모두 지우기 <kbd>Backspace</kbd></button>
          <button data-act="cancel">닫기 <kbd>Esc</kbd></button>
        </div>
      </div>
    </div>

    <!-- 타이틀 / 도감 / 결말 -->
    <div id="overlay" hidden></div>
  </div>
</div>
<script type="module" src="src/game.js?rev=8"></script>
</body>
</html>
